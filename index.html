<style>
:root{--bg:#f4f5f7;--bar:#fff;--tx:#1b1d21;--mut:#6b7280;--ac:#7c3aed;--bd:#e2e4e9;--tab:#e9eaee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161a;--bar:#1f2127;--tx:#eceef2;--mut:#9aa1ad;--ac:#a78bfa;--bd:#2c2f37;--tab:#2a2d35}}
:root[data-theme="dark"]{--bg:#15161a;--bar:#1f2127;--tx:#eceef2;--mut:#9aa1ad;--ac:#a78bfa;--bd:#2c2f37;--tab:#2a2d35}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;display:flex;flex-direction:column}
#tabs{display:flex;gap:4px;padding:6px 6px 0;overflow-x:auto;background:var(--bg)}
.tab{display:flex;align-items:center;gap:6px;min-width:110px;max-width:170px;padding:7px 10px;border-radius:10px 10px 0 0;background:var(--tab);font-size:13px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--bar)}
.tab span{overflow:hidden;text-overflow:ellipsis;flex:1}

#nav{display:flex;gap:4px;align-items:center;padding:6px;background:var(--bar);border-bottom:1px solid var(--bd)}
#nav button{border:0;background:none;color:var(--tx);font-size:18px;width:34px;height:34px;border-radius:50%;cursor:pointer}
#nav button:active{background:var(--tab)}
#url{flex:1;min-width:0;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:18px;padding:8px 14px;font-size:14px;outline:none}
#url:focus{border-color:var(--ac)}
#main{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
iframe.on{display:block}
.home{position:absolute;inset:0;overflow:auto;display:none;padding:28px 18px;text-align:center}
.home.on{display:block}
.lg{width:min(230px,62vw);height:auto;border-radius:26px;display:block;margin:3vh auto 8px}
.logo{font-size:44px;font-weight:700;color:var(--ac);letter-spacing:1px;margin-top:6vh}
.sub{color:var(--mut);margin:4px 0 22px;font-size:14px}
.sb{width:min(560px,100%);box-sizing:border-box;border:1px solid var(--bd);background:var(--bar);color:var(--tx);border-radius:26px;padding:13px 20px;font-size:16px;outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px;max-width:560px;margin:26px auto 0}
.q{background:var(--bar);border:1px solid var(--bd);border-radius:14px;padding:12px 4px;font-size:12px;cursor:pointer;color:var(--tx)}
.q i{display:block;font-style:normal;font-size:22px;margin-bottom:4px}
h4{margin:26px 0 0;color:var(--mut);font-weight:500;font-size:13px}
#gpanel{position:absolute;inset:0;overflow:auto;display:none;padding:10px 14px;background:var(--bar)}
#gpanel.on{display:block}
#gpanel .gsc-control-cse{background:transparent;border:0;padding:0}
#spanel{position:absolute;inset:0;overflow:auto;display:none;padding:10px 16px 30px;background:var(--bar)}
#spanel.on{display:block}
.sm{color:var(--mut);font-size:13px;padding:8px 0}.sm a{color:var(--ac);cursor:pointer}
.sr{padding:10px 0;max-width:680px}.sr .su{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr>a{font-size:17px;color:var(--ac);cursor:pointer;line-height:1.35;display:block;margin:2px 0}
.sr p{margin:2px 0 0;font-size:14px;line-height:1.5;color:var(--tx)}
#gsetup{padding:24px;line-height:1.7;font-size:14px;color:var(--tx)}
#note{font-size:12px;color:var(--mut);padding:4px 10px;background:var(--bar);border-top:1px solid var(--bd);display:flex;justify-content:space-between;gap:8px}
#note a{color:var(--ac);text-decoration:none;cursor:pointer}
</style>

var HOME="mumim:home",GP="mumim:google",SP="mumim:search";
var quick=[["🔍","Google",GP],["📖","উইকিপিডিয়া","https://bn.wikipedia.org"],["🔎","DuckDuckGo","https://duckduckgo.com"],["🗺️","OpenStreetMap","https://www.openstreetmap.org"],["📰","প্রথম আলো","https://www.prothomalo.com"],["💻","GitHub","https://github.com"],["🎞️","Archive.org","https://archive.org"]];
var tabs=[],cur=null,nid=1,marks=[];
try{marks=JSON.parse(localStorage.getItem("mumim-marks")||"[]")}catch(e){marks=[]}
function save(){try{localStorage.setItem("mumim-marks",JSON.stringify(marks))}catch(e){}}
var $=function(i){return document.getElementById(i)};

function norm(s){
  s=s.trim(); if(!s) return HOME;
  if(s===HOME) return s;
  if(s.indexOf(GP)===0||s.indexOf(SP)===0) return s;
  if(/^https?:\/\//i.test(s)) return s;
  if(/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(s)&&!/\s/.test(s)) return "https://"+s;
  if(WORKER) return SP+"?q="+encodeURIComponent(s);
  if(CSE_ID) return GP+"?q="+encodeURIComponent(s);
  return "https://duckduckgo.com/?q="+encodeURIComponent(s);
}
function newTab(u){
  var t={id:nid++,url:HOME,hist:[HOME],i:0,title:"নতুন ট্যাব"};
  tabs.push(t);
  var f=document.createElement("iframe");f.id="f"+t.id;
  f.setAttribute("referrerpolicy","origin");
  $("main").appendChild(f);
  var h=document.createElement("div");h.className="home";h.id="h"+t.id;h.innerHTML=homeHTML(t.id);
  $("main").appendChild(h);
  switchTo(t.id);
  if(u&&u!==HOME) go(u);
}
function homeHTML(id){
  var m=marks.length?'<h4>বুকমার্ক</h4><div class="grid">'+marks.map(function(x){return '<div class="q" data-u="'+x.replace(/"/g,"&quot;")+'"><i>★</i>'+x.replace(/^https?:\/\/(www\.)?/,"").slice(0,14)+'</div>'}).join("")+'</div>':"";
  return '<img class="lg" src="'+LOGO+'" alt="Mumin Browser"><div class="sub">দ্রুত, সহজ, আপনার ব্রাউজার</div>'+
  '<input class="sb" placeholder="সার্চ করুন বা ঠিকানা দিন" data-s="1"><div class="grid">'+
  quick.map(function(q){return '<div class="q" data-u="'+q[2]+'"><i>'+q[0]+'</i>'+q[1]+'</div>'}).join("")+'</div>'+m;
}
function cT(){return tabs.filter(function(t){return t.id===cur})[0]}
function go(s,noPush){
  var t=cT();if(!t)return;var u=norm(s);
  if(!noPush){t.hist=t.hist.slice(0,t.i+1);t.hist.push(u);t.i++}
  t.url=u;show();
}
function show(){
  var t=cT();if(!t)return;
  var isS=t.url.indexOf(SP)===0,isG=t.url.indexOf(GP)===0;
  tabs.forEach(function(x){
    $("f"+x.id).classList.toggle("on",x.id===cur&&x.url!==HOME&&x.url.indexOf(GP)!==0&&x.url.indexOf(SP)!==0);
    $("h"+x.id).classList.toggle("on",x.id===cur&&x.url===HOME);
  });
  if(window.gp)gp.classList.toggle("on",isG);
  if(window.sp)sp.classList.toggle("on",isS);
  var f=$("f"+t.id);
  if(t.url===HOME){t.title="নতুন ট্যাব";$("url").value="";$("h"+t.id).innerHTML=homeHTML(t.id)}
  else if(isS){var q0=decodeURIComponent((t.url.split("?q=")[1]||""));t.title=q0||"সার্চ";$("url").value=q0;runSearch(q0)}else if(isG){var q=decodeURIComponent((t.url.split("?q=")[1]||""));t.title="Google";$("url").value=q;runGoogle(q)}
  else{ if(f.dataset.u!==t.url){f.dataset.u=t.url;f.src=PROXY?PROXY+encodeURIComponent(t.url):t.url} t.title=t.url.replace(/^https?:\/\/(www\.)?/,"").split("/")[0]; $("url").value=t.url}
  $("st").textContent=marks.indexOf(t.url)>-1?"★":"☆";
  $("note").style.display=(t.url===HOME||isG||isS)?"none":"flex";
  drawTabs();
}
function switchTo(id){cur=id;show()}
function closeTab(id){
  var i=tabs.findIndex(function(t){return t.id===id});
  $("f"+id).remove();$("h"+id).remove();tabs.splice(i,1);
  if(!tabs.length){newTab();return}
  if(cur===id)cur=tabs[Math.max(0,i-1)].id;show();
}
function drawTabs(){
  var el=$("tabs");el.innerHTML="";
  tabs.forEach(function(t){
    var d=document.createElement("div");d.className="tab"+(t.id===cur?" on":"");
    d.innerHTML="<span></span><b>✕</b>";d.firstChild.textContent=t.title;
    d.onclick=function(){switchTo(t.id)};
    d.lastChild.onclick=function(e){e.stopPropagation();closeTab(t.id)};
    el.appendChild(d);
  });
  var p=document.createElement("button");p.id="plus";p.textContent="+";p.onclick=function(){newTab()};el.appendChild(p);
}
$("url").addEventListener("keydown",function(e){if(e.key==="Enter"){go(this.value);this.blur()}});
$("url").addEventListener("focus",function(){this.select()});
$("bk").onclick=function(){var t=cT();if(t.i>0){t.i--;t.url=t.hist[t.i];show()}};
$("fw").onclick=function(){var t=cT();if(t.i<t.hist.length-1){t.i++;t.url=t.hist[t.i];show()}};
$("rl").onclick=function(){var t=cT();if(t.url.indexOf(SP)===0){show();return}if(t.url!==HOME&&t.url.indexOf(GP)!==0){var f=$("f"+t.id);f.src=PROXY?PROXY+encodeURIComponent(t.url):t.url}};
$("hm").onclick=function(){go(HOME)};
$("st").onclick=function(){
  var t=cT();if(t.url===HOME)return;
  var i=marks.indexOf(t.url);if(i>-1)marks.splice(i,1);else marks.push(t.url);
  save();show();
};
$("ext").onclick=function(){var t=cT();if(t.url!==HOME&&t.url.indexOf(GP)!==0)window.open(t.url,"_blank","noopener")};
$("main").addEventListener("click",function(e){
  var q=e.target.closest(".q");if(q)go(q.dataset.u);
});
$("main").addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target.dataset.s){go(e.target.value)}
});
var gp=document.createElement("div");gp.id="gpanel";$("main").appendChild(gp);
var gReady=false,gLoading=false,gRendered=false,gQ="";
function runGoogle(q){
  gQ=q;
  if(!CSE_ID){gp.innerHTML='<div id="gsetup"><b>Google সার্চ চালু করুন</b><br>১) programmablesearchengine.google.com এ গিয়ে সার্চ ইঞ্জিন বানান ("পুরো ওয়েব সার্চ করুন" বেছে নিন)।<br>২) যে Search engine ID (cx) পাবেন, ফাইলের উপরে <code>CSE_ID</code> এ বসান।</div>';return}
  if(gReady){doG();return}
  if(gLoading)return;gLoading=true;
  window.__gcse={parsetags:"explicit",callback:function(){gReady=true;doG()}};
  var sc=document.createElement("script");sc.async=true;sc.src="https://cse.google.com/cse.js?cx="+encodeURIComponent(CSE_ID);
  document.head.appendChild(sc);
}
function doG(){
  try{
    if(!gRendered){gp.innerHTML="";google.search.cse.element.render({div:"gpanel",tag:"search",gname:"mg",attributes:{linkTarget:"_blank"}});gRendered=true}
    var el=google.search.cse.element.getElement("mg");if(el&&gQ)el.execute(gQ);
  }catch(e){}
}
var sp=document.createElement("div");sp.id="spanel";$("main").appendChild(sp);
var sq=0;
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function runSearch(q){
  if(!q){sp.innerHTML="";return}
  var id=++sq;sp.innerHTML='<div class="sm">খোঁজা হচ্ছে…</div>';
  fetch(WORKER.replace(/\/$/,"")+"/search?q="+encodeURIComponent(q)).then(function(r){return r.json()}).then(function(d){
    if(id!==sq)return;
    var rs=d.results||[];
    var h='<div class="sm">“'+esc(q)+'” এর ফলাফল'+(CSE_ID?' · <a data-g="'+esc(q)+'">Google-এ দেখুন</a>':'')+'</div>';
    rs.forEach(function(x){h+='<div class="sr"><div class="su">'+esc(x.url.replace(/^https?:\/\/(www\.)?/,""))+'</div><a data-u="'+esc(x.url)+'">'+esc(x.title)+'</a><p>'+esc(x.snippet||"")+'</p></div>'});
    if(!rs.length)h+='<div class="sm">কিছু পাওয়া যায়নি।</div>';
    sp.innerHTML=h;sp.scrollTop=0;
  }).catch(function(){if(id===sq)sp.innerHTML='<div class="sm">সার্চ সার্ভারে সংযোগ হয়নি। WORKER ঠিকানা ঠিক আছে কিনা দেখুন।</div>'});
}
sp.addEventListener("click",function(e){
  var a=e.target.closest("a");if(!a)return;
  if(a.dataset.u)go(a.dataset.u);
  else if(a.dataset.g)go(GP+"?q="+encodeURIComponent(a.dataset.g));
});
window.addEventListener("message",function(e){
  var d=e.data;if(!d||!d.mumin)return;
  var t=cT();if(!t)return;
  if(e.source!==$("f"+t.id).contentWindow)return;
  if(d.t==="nav")go(d.url);
  else if(d.t==="title"&&d.title){t.title=d.title.slice(0,28);drawTabs()}
});
$("hl").src=LOGO;
newTab();
</script>
